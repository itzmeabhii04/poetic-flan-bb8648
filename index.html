<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PG CA Manager</title>
<meta name="description" content="Rent collection, electricity sub-meter audit, WhatsApp reminders and a CA-ready profit &amp; tax ledger for PG and hostel owners. Works offline.">
<meta name="theme-color" content="#FF7A1A">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="PG CA Manager">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PG Manager">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icons/logo.svg">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
if (window.tailwind) tailwind.config = {
  theme: { extend: {
    colors: { bg:'#0B0B0C', card:'#161618', field:'#202024', line:'#2C2C32', brand:'#FF7A1A', ok:'#3DDC84', bad:'#FF5A5F', muted:'#9A9AA3', ink:'#F4F4F5' },
    fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] }
  } }
};

<style>
:root{--bg:#0B0B0C;--card:#161618;--field:#202024;--line:#2C2C32;--brand:#FF7A1A;--ok:#3DDC84;--bad:#FF5A5F;--tx:#F4F4F5;--mu:#9A9AA3;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums}
.safe-top{padding-top:max(env(safe-area-inset-top),0px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.fld{display:block;width:100%;height:48px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--tx);font:500 16px Inter,system-ui,sans-serif;appearance:none;-webkit-appearance:none}
select.fld{background-image:linear-gradient(45deg,transparent 50%,#9A9AA3 50%),linear-gradient(135deg,#9A9AA3 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
textarea.fld{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.fld:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,122,26,.22)}
.fld.invalid{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,90,95,.18)}
.fld::placeholder{color:#62626b}
.lbl{display:block;font-size:11px;font-weight:700;color:var(--mu);margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em}
.err{color:var(--bad);font-size:12px;font-weight:500;margin-top:5px}
.err:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;font:600 14px Inter,system-ui,sans-serif;border:1px solid transparent;white-space:nowrap;cursor:pointer;text-decoration:none;transition:transform .1s ease,filter .15s ease;user-select:none}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.ib:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-brand{background:var(--brand);color:#1A0B00}
.btn-ok{background:var(--ok);color:#03210F}
.btn-ghost{background:var(--field);border-color:var(--line);color:var(--tx)}
.btn-bad{background:rgba(255,90,95,.08);border-color:rgba(255,90,95,.45);color:var(--bad)}
.btn-wa{background:rgba(61,220,132,.08);border-color:rgba(61,220,132,.35);color:var(--ok)}
.btn-sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.ib{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:12px;background:var(--field);border:1px solid var(--line);color:var(--tx);cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.b-over{background:rgba(255,90,95,.14);color:var(--bad);border:1px solid rgba(255,90,95,.4)}
.b-today{background:var(--brand);color:#1A0B00;animation:pulse 1.6s ease-out infinite}
.b-soon{background:var(--field);color:var(--mu);border:1px solid var(--line)}
.b-ok{background:rgba(61,220,132,.12);color:var(--ok);border:1px solid rgba(61,220,132,.35)}
.b-brand{background:rgba(255,122,26,.12);color:var(--brand);border:1px solid rgba(255,122,26,.35)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,26,.65)}70%{box-shadow:0 0 0 9px rgba(255,122,26,0)}100%{box-shadow:0 0 0 0 rgba(255,122,26,0)}}
.urg-over{border-color:rgba(255,90,95,.45)!important}
.urg-today{border-color:rgba(255,122,26,.55)!important}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 8px;font-size:10.5px;font-weight:600;color:var(--mu);background:none;border:0;cursor:pointer}
.tab i{font-size:18px}
.tab.on{color:var(--brand)}
.tab.on i{filter:drop-shadow(0 0 8px rgba(255,122,26,.5))}
.navbar{padding-bottom:max(env(safe-area-inset-bottom),6px);background:rgba(11,11,12,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sheet{max-height:92vh;max-height:92dvh;overflow:auto;padding-bottom:max(env(safe-area-inset-bottom),16px)}
.fade-in{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.slide-up{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
input[type=month]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
.mpick{background:transparent;border:0;color:var(--tx);font:700 16px Inter,system-ui,sans-serif;text-align:center;width:100%;padding:0}
.mpick:focus{outline:none}
.hr{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{color:var(--mu);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px 4px;text-align:right;border-bottom:1px solid #1f1f23}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
#toast{bottom:calc(84px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Printable CA Auditor Tax Statement ---------- */
#printDoc{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  html,body{background:#fff!important;color:#111!important}
  #shell,#modal,#toast{display:none!important}
  #printDoc{display:block!important;font:10.5pt/1.45 Inter,Arial,sans-serif;color:#111}
  #printDoc h1{font-size:17pt;margin:0;letter-spacing:-.01em}
  #printDoc h2{font-size:11.5pt;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid #111;text-transform:uppercase;letter-spacing:.05em}
  #printDoc table{width:100%;border-collapse:collapse;margin-top:4px;page-break-inside:auto}
  #printDoc tr{page-break-inside:avoid}
  #printDoc th,#printDoc td{border:1px solid #bdbdbd;padding:4px 7px;text-align:left;vertical-align:top}
  #printDoc th{background:#f1f1f1!important;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printDoc .r{text-align:right;font-variant-numeric:tabular-nums}
  #printDoc .tot td{font-weight:800;background:#f7f7f7!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printDoc .meta td{border:0;padding:1px 0}
  #printDoc .muted{color:#555}
  #printDoc .sign{display:flex;justify-content:space-between;margin-top:56px;gap:40px}
  #printDoc .sign div{flex:1;border-top:1px solid #111;padding-top:6px;text-align:center;font-size:9.5pt}
}
</style>
</head>
<body>
<div id="shell" class="min-h-screen">
  <!-- Header -->
  <header class="safe-top sticky top-0 z-30 bg-bg/90 backdrop-blur border-b border-line">
    <div class="max-w-xl mx-auto px-4 h-16 flex items-center gap-3">
      <svg class="w-10 h-10 shrink-0" viewBox="0 0 512 512" role="img" aria-label="PG CA Manager logo">
        <rect width="512" height="512" rx="112" fill="#161618"/>
        <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#2C2C32" stroke-width="8"/>
        <g transform="translate(0 -6)">
          <path d="M120 400V196l136-84 136 84v204" fill="none" stroke="#FF7A1A" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M92 400h328" stroke="#FF7A1A" stroke-width="24" stroke-linecap="round"/>
          <rect x="166" y="300" width="36" height="78" rx="6" fill="#FF7A1A" opacity=".55"/>
          <rect x="222" y="262" width="36" height="116" rx="6" fill="#FF7A1A" opacity=".8"/>
          <rect x="278" y="224" width="36" height="154" rx="6" fill="#FF7A1A"/>
          <path d="M160 270l60-38 44 22 76-70" fill="none" stroke="#3DDC84" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M312 180h30v30" fill="none" stroke="#3DDC84" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M356 300l42 15v30c0 28-19 47-42 56-23-9-42-28-42-56v-30z" fill="#161618" stroke="#3DDC84" stroke-width="11" stroke-linejoin="round"/>
          <path d="M338 344l13 13 24-26" fill="none" stroke="#3DDC84" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <div class="min-w-0 flex-1">
        <div class="text-[17px] font-extrabold tracking-tight leading-tight">PG <span class="text-brand">CA</span> Manager</div>
        <div id="hdrSub" class="text-xs text-muted truncate"></div>
      </div>
      <span id="netDot" class="badge b-ok" title="Connection status"><i class="fa-solid fa-circle text-[6px]"></i><span>Online</span></span>
      <button id="installBtn" class="btn btn-brand btn-sm hidden" data-act="install"><i class="fa-solid fa-download"></i>Install</button>
    </div>
  </header>

  <main id="view" class="max-w-xl mx-auto px-4 pt-4 pb-32"></main>

  <!-- Bottom navigation -->
  <nav class="navbar fixed bottom-0 inset-x-0 z-30 border-t border-line" aria-label="Main">
    <div class="max-w-xl mx-auto flex" id="tabs">
      <button class="tab" data-act="tab" data-id="home"><i class="fa-solid fa-house"></i>Home</button>
      <button class="tab" data-act="tab" data-id="rooms"><i class="fa-solid fa-bed"></i>Rooms</button>
      <button class="tab" data-act="tab" data-id="meter"><i class="fa-solid fa-bolt"></i>Meter</button>
      <button class="tab" data-act="tab" data-id="ca"><i class="fa-solid fa-scale-balanced"></i>CA Ledger</button>
      <button class="tab" data-act="tab" data-id="setup"><i class="fa-solid fa-gear"></i>Setup</button>
    </div>
  </nav>
</div>

<!-- Modal / bottom sheet -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center" role="dialog" aria-modal="true">
  <div class="absolute inset-0 bg-black/70" data-act="closeModal"></div>
  <div id="sheet" class="sheet slide-up relative w-full max-w-xl bg-card border border-line rounded-t-3xl sm:rounded-3xl p-5"></div>
</div>

<!-- Toast -->
<div id="toast" class="fixed inset-x-0 z-[60] px-4 pointer-events-none flex justify-center"></div>

<!-- Print-only statement -->
<section id="printDoc" aria-hidden="true"></section>

<script>
'use strict';
/* =====================================================================
   PG CA Manager — single-file offline PWA. All data lives in localStorage.
   ===================================================================== */
const KEY = 'pgca_manager_v2', VER = '2.0.0';
const CATS = [
  ['wifi',  'WiFi',        'fa-wifi',               '#5B8DEF'],
  ['maid',  'Maid',        'fa-broom',              '#C17BFF'],
  ['maint', 'Maintenance', 'fa-screwdriver-wrench', '#FFC145'],
  ['mess',  'Mess',        'fa-utensils',           '#2EC4B6'],
  ['water', 'Water',       'fa-droplet',            '#8BE9FD'],
  ['tax',   'Taxes',       'fa-landmark',           '#FF8FA3'],
  ['misc',  'Misc',        'fa-ellipsis',           '#9A9AA3']
];
const CAT = Object.fromEntries(CATS.map(c => [c[0], { key:c[0], name:c[1], icon:c[2], color:c[3] }]));
const PHONE = /^\d{10}$/;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const thisMonth = () => today().slice(0, 7);
const sum = a => a.reduce((t, x) => t + (Number(x) || 0), 0);
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.abs(Math.round(Number(n) || 0)).toLocaleString('en-IN');
const pct = n => (isFinite(n) ? (Math.round(n * 10) / 10) : 0) + '%';
const dim = m => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
const shiftM = (m, d) => { const [y, mo] = m.split('-').map(Number); const t = new Date(y, mo - 1 + d, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; };
const mLabel = (m, long) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo - 1, 1).toLocaleDateString('en-IN', { month: long ? 'long' : 'short', year: 'numeric' }); };
const dLabel = d => { if (!d) return '—'; const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const validDate = s => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d); return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d; };
const validMonth = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s || '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fyOf = m => { const [y, mo] = m.split('-').map(Number); const s = mo >= 4 ? y : y - 1; return { start: `${s}-04`, label: `FY ${s}-${String(s + 1).slice(2)}`, months: Array.from({ length: 12 }, (_, i) => shiftM(`${s}-04`, i)) }; };

/* ---------- state ---------- */
let S, TAB = 'home', M = thisMonth(), deferredPrompt = null, modalResolve = null;

function blank() {
  return { v: 2, owner: { name: '', pg: '', phone: '', address: '', pan: '', gstin: '' }, rate: 9, rooms: [], pay: {}, read: {}, exp: [] };
}
function normalize(d) {
  if (d && d.data && d.app === 'pg-ca-manager') d = d.data;
  if (!d || typeof d !== 'object' || !Array.isArray(d.rooms)) throw new Error('This file is not a PG CA Manager backup.');
  const b = blank();
  return {
    ...b, ...d,
    owner: { ...b.owner, ...(d.owner || {}) },
    rate: Number(d.rate) >= 0 ? Number(d.rate) : b.rate,
    rooms: d.rooms.filter(r => r && r.id),
    pay: d.pay && typeof d.pay === 'object' ? d.pay : {},
    read: d.read && typeof d.read === 'object' ? d.read : {},
    exp: Array.isArray(d.exp) ? d.exp.filter(e => e && e.id && validDate(e.date)) : []
  };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save — device storage is full. Export a backup.', 'bad'); }
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { S = normalize(JSON.parse(raw)); return; } } catch (e) { console.warn(e); }
  S = blank(); seed(); save();
}

function seed() {
  const m0 = thisMonth(), m1 = shiftM(m0, -1), m2 = shiftM(m0, -2), td = new Date().getDate();
  S.sampleOwner = true;
  S.owner = { name: 'Rajesh Sharma', pg: 'Sharma PG & Hostel', phone: '9876500000', address: '12, Sector 21, Gurugram, Haryana 122016', pan: 'ABCPS1234K', gstin: '' };
  const R = (no, rent, dueDay, tenant, phone, guardian, gphone, moveIn, meterStart) =>
    ({ id: uid(), no, rent, deposit: rent, dueDay, tenant, phone, guardian, gphone, moveIn, meterStart, sample: true });
  const r1 = R('101', 8500, 5,  'Rahul Verma', '9876543210', 'Suresh Verma', '9812345678', m2 + '-01', 1200);
  const r2 = R('102', 7500, td, 'Aman Gupta',  '9898989898', 'Meena Gupta',  '9811122233', m2 + '-04', 2000);
  const r3 = R('103', 9000, 28, 'Priya Singh', '9765432109', 'Anil Singh',   '9700011122', m2 + '-10', 840);
  const r4 = R('104', 7000, 1,  '', '', '', '', '', 3150);
  const r5 = R('105', 8000, 3,  'Karan Mehta', '9822334455', '', '', m1 + '-01', 450);
  S.rooms = [r1, r2, r3, r4, r5];
  const rd = (m, r, v) => ((S.read[m] ??= {})[r.id] = { r: v, rate: 9 });
  rd(m1, r1, 1260); rd(m1, r2, 2045); rd(m1, r3, 880); rd(m1, r5, 510);
  rd(m0, r1, 1318); rd(m0, r2, 2101); rd(m0, r5, 566);
  for (const r of [r1, r2, r3, r5]) recordPay(r, m1, `${m1}-${pad(Math.min(r.dueDay, dim(m1)))}`);
  recordPay(r5, m0, `${m0}-${pad(Math.min(3, td))}`);
  const E = (date, cat, amt, note) => S.exp.push({ id: uid(), date, cat, amt, note, sample: true });
  E(m1 + '-02', 'wifi', 1499, 'Airtel fibre 200 Mbps'); E(m1 + '-05', 'maid', 6000, 'Housekeeping salary');
  E(m1 + '-12', 'maint', 2500, 'Geyser repair, Room 103'); E(m1 + '-28', 'mess', 11500, 'Groceries & cook');
  E(m1 + '-15', 'tax', 1800, 'Property tax instalment'); E(m1 + '-20', 'misc', 450, 'Cleaning supplies');
  E(m0 + '-01', 'wifi', 1499, 'Airtel fibre 200 Mbps'); E(m0 + '-0' + Math.min(5, td), 'maid', 6000, 'Housekeeping salary');
  E(m0 + '-0' + Math.min(3, td), 'water', 800, 'Water tanker'); E(m0 + '-0' + Math.min(7, td), 'mess', 12000, 'Groceries & cook');
}

/* ---------- domain logic ---------- */
const room = id => S.rooms.find(r => r.id === id);
const readingOf = (id, m) => S.read[m]?.[id] ?? null;
function prevReading(r, m) {
  let best = null;
  for (const k of Object.keys(S.read)) if (k < m && S.read[k]?.[r.id] && (!best || k > best)) best = k;
  return best ? { val: Number(S.read[best][r.id].r), from: best } : { val: Number(r.meterStart) || 0, from: null };
}
function nextReading(r, m) {
  let best = null;
  for (const k of Object.keys(S.read)) if (k > m && S.read[k]?.[r.id] && (!best || k < best)) best = k;
  return best ? { val: Number(S.read[best][r.id].r), from: best } : null;
}
function elec(r, m) {
  const e = readingOf(r.id, m); if (!e) return null;
  const p = prevReading(r, m), units = Math.max(0, Number(e.r) - p.val), rate = Number(e.rate) || 0;
  return { units, rate, amt: Math.round(units * rate), prev: p.val, cur: Number(e.r), from: p.from };
}
function bill(r, m) {
  const e = elec(r, m), rent = Number(r.rent) || 0;
  return { rent, elec: e ? e.amt : 0, units: e ? e.units : 0, rate: e ? e.rate : S.rate, metered: !!e, total: rent + (e ? e.amt : 0) };
}
const paidRec = (r, m) => S.pay[m]?.[r.id];
const active = (r, m) => !!r.tenant && (!r.moveIn || r.moveIn.slice(0, 7) <= m);
const dueOf = (r, m) => `${m}-${pad(Math.min(Number(r.dueDay) || 1, dim(m)))}`;
function urgency(r, m) {
  const d = daysBetween(today(), dueOf(r, m));
  return d < 0 ? { k: 'over', d: -d } : d === 0 ? { k: 'today', d: 0 } : { k: 'soon', d };
}
function recordPay(r, m, on) {
  const b = bill(r, m);
  (S.pay[m] ??= {})[r.id] = { amt: b.total, rent: b.rent, elec: b.elec, units: b.units, on: on || today(), tenant: r.tenant, no: r.no };
  return b;
}
function stats(m) {
  const pays = Object.values(S.pay[m] || {});
  const rentC = sum(pays.map(p => p.rent)), elecC = sum(pays.map(p => p.elec)), collected = rentC + elecC;
  const pend = S.rooms.filter(r => active(r, m) && !paidRec(r, m));
  const pending = sum(pend.map(r => bill(r, m).total));
  const exps = S.exp.filter(e => e.date.slice(0, 7) === m);
  const byCat = CATS.map(([k]) => ({ ...CAT[k], amt: sum(exps.filter(e => e.cat === k).map(e => e.amt)) }));
  const expense = sum(exps.map(e => e.amt)), net = collected - expense;
  const margin = collected ? net / collected * 100 : (expense ? -100 : 0);
  const eff = collected + pending ? collected / (collected + pending) * 100 : null;
  return { pays, rentC, elecC, collected, pend, pending, exps, byCat, expense, net, margin, eff };
}

function toast(msg, kind = 'info', action) {
  const t = $('#toast'), id = uid();
  const color = kind === 'bad' ? 'border-bad/50' : kind === 'ok' ? 'border-ok/50' : 'border-line';
  const icon = kind === 'bad' ? 'fa-circle-exclamation text-bad' : kind === 'ok' ? 'fa-circle-check text-ok' : kind === 'warn' ? 'fa-triangle-exclamation text-brand' : 'fa-circle-info text-muted';
  t.innerHTML = `<div id="t${id}" class="fade-in pointer-events-auto max-w-xl w-full bg-card border ${color} rounded-2xl shadow-2xl shadow-black/60 px-4 py-3 flex items-center gap-3" role="status">
    <i class="fa-solid ${icon}"></i><div class="flex-1 text-sm font-medium">${esc(msg)}</div>
    ${action ? `<button class="btn btn-ghost btn-sm" id="ta${id}">${esc(action.label)}</button>` : ''}</div>`;
  if (action) $('#ta' + id).onclick = () => { t.innerHTML = ''; action.fn(); };
  clearTimeout(toast.tm); toast.tm = setTimeout(() => { const el = $('#t' + id); if (el) el.remove(); }, action ? 6500 : 3500);
}
function openModal(html) {
  $('#sheet').innerHTML = `<div class="w-10 h-1.5 rounded-full bg-line mx-auto mb-4 sm:hidden"></div>${html}`;
  $('#modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  if (!history.state?.modal) history.pushState({ modal: 1 }, '');
  setTimeout(() => $('#sheet [autofocus]')?.focus(), 60);
}
function closeModal(fromPop) {
  if ($('#modal').classList.contains('hidden')) return;
  $('#modal').classList.add('hidden'); $('#sheet').innerHTML = ''; document.body.style.overflow = '';
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(null); }
  if (!fromPop && history.state?.modal) history.back();
}
window.addEventListener('popstate', () => closeModal(true));
function choose({ title, msg, icon = 'fa-circle-question', tone = 'brand', buttons }) {
  return new Promise(res => {
    openModal(`<div class="text-center px-2">
      <div class="w-14 h-14 rounded-2xl mx-auto grid place-items-center text-2xl ${tone === 'bad' ? 'bg-bad/10 text-bad' : 'bg-brand/10 text-brand'}"><i class="fa-solid ${icon}"></i></div>
      <h3 class="text-lg font-bold mt-3">${esc(title)}</h3><p class="text-sm text-muted mt-2 leading-relaxed">${msg}</p></div>
      <div class="grid gap-2 mt-5">${buttons.map((b, i) => `<button class="btn ${b.cls || 'btn-ghost'} h-12" data-choice="${i}">${b.icon ? `<i class="fa-solid ${b.icon}"></i>` : ''}${esc(b.label)}</button>`).join('')}
      <button class="btn btn-ghost h-12" data-choice="-1">Cancel</button></div>`);
    modalResolve = res;
    $('#sheet').querySelectorAll('[data-choice]').forEach(el => el.onclick = () => {
      const i = Number(el.dataset.choice); const r = modalResolve; modalResolve = null; closeModal(); r(i < 0 ? null : buttons[i].value);
    });
  });
}

}
function go(tab) { TAB = tab; render(); window.scrollTo({ top: 0 }); }

/* ---------- rooms modal ---------- */

      ${field('moveIn', 'Move-in date', 'type="date" placeholder="YYYY-MM-DD"', r.moveIn || (id ? today() : ''))}
      ${field('guardian', 'Guardian name', 'maxlength="60"', r.guardian)}

/* ---------- forms ---------- */
function showErrors(form, errs) {
  form.querySelectorAll('[data-err]').forEach(p => { p.textContent = errs[p.dataset.err] || ''; });
  form.querySelectorAll('.fld').forEach(f => f.classList.toggle('invalid', !!errs[f.name]));
  const first = Object.keys(errs)[0];
  if (first) { form.querySelector(`[name="${first}"]`)?.focus(); return false; }
  return true;
}
const FORMS = {
  room(form) {
    const id = form.dataset.id, d = Object.fromEntries(new FormData(form)), e = {};
    for (const k in d) d[k] = String(d[k]).trim();
    if (!d.no) e.no = 'Room number is required.';
    else if (S.rooms.some(r => r.id !== id && String(r.no).toLowerCase() === d.no.toLowerCase())) e.no = `Room ${d.no} already exists.`;
    const due = Number(d.dueDay);
    if (!Number.isInteger(due) || due < 1 || due > 31) e.dueDay = 'Enter a whole number from 1 to 31.';
    if (!(Number(d.rent) > 0)) e.rent = 'Enter the monthly rent.';
    if (d.deposit && !(Number(d.deposit) >= 0)) e.deposit = 'Invalid amount.';
    if (d.tenant) {
      if (!PHONE.test(d.phone)) e.phone = 'Must be exactly 10 digits.';
      if (!validDate(d.moveIn)) e.moveIn = 'Use a valid YYYY-MM-DD date.';
    } else if (d.phone && !PHONE.test(d.phone)) e.phone = 'Must be exactly 10 digits.';
    if (d.gphone && !PHONE.test(d.gphone)) e.gphone = 'Must be exactly 10 digits.';
    if (d.gphone && d.gphone === d.phone) e.gphone = 'Guardian phone should differ from tenant phone.';
    if (d.meterStart && !(Number(d.meterStart) >= 0)) e.meterStart = 'Reading cannot be negative.';
    if (!showErrors(form, e)) return;
    const data = { no: d.no, rent: Number(d.rent), deposit: Number(d.deposit) || 0, dueDay: due, tenant: d.tenant,
      phone: d.tenant ? d.phone : '', guardian: d.tenant ? d.guardian : '', gphone: d.tenant ? d.gphone : '', moveIn: d.tenant ? d.moveIn : '', meterStart: Number(d.meterStart) || 0 };
    if (id) Object.assign(room(id), data); else S.rooms.push({ id: uid(), ...data });
    save(); closeModal(); render(); toast(id ? `Room ${data.no} updated` : `Room ${data.no} added`, 'ok');
  },
  meter(form) {
    const r = room(form.dataset.id), raw = form.cur.value.trim(), v = Number(raw), p = prevReading(r, M), n = nextReading(r, M);
    const fail = msg => { form.cur.classList.add('invalid'); form.cur.focus(); toast(msg, 'bad'); };
    if (raw === '' || !isFinite(v)) return fail('Enter a valid numeric reading.');
    if (v < 0) return fail('Reading cannot be negative — rejected.');
    if (v < p.val) return fail(`Rejected: ${v} is lower than the previous reading ${p.val}.`);
    if (n && v > n.val) return fail(`Rejected: ${v} is higher than the ${mLabel(n.from)} reading ${n.val}.`);
    const existing = readingOf(r.id, M);
    (S.read[M] ??= {})[r.id] = { r: v, rate: existing && existing.r === v ? existing.rate : S.rate };
    save(); render();
    const e = elec(r, M);
    toast(`RM ${r.no}: ${e.units} units = ${inr(e.amt)}`, paidRec(r, M) ? 'warn' : 'ok');
  },
  expense(form) {
    const d = Object.fromEntries(new FormData(form)), e = {}, amt = Number(d.amt);
    if (!(amt > 0)) e.amt = 'Enter an amount above 0.';
    if (!validDate(d.date)) e.date = 'Pick a valid date.';
    if (!CAT[d.cat]) e.cat = 'Choose a category.';
    if (!showErrors(form, e)) return;
    S.exp.push({ id: uid(), cat: d.cat, amt: Math.round(amt * 100) / 100, date: d.date, note: String(d.note || '').trim() });
    save();
    const m = d.date.slice(0, 7);
    render();
    toast(m === M ? `${CAT[d.cat].name} expense of ${inr(amt)} added` : `Saved to ${mLabel(m)}`, 'ok', m === M ? null : { label: 'View', fn: () => { M = m; render(); } });
  },
  owner(form) {
    const d = Object.fromEntries(new FormData(form)), e = {};
    for (const k in d) d[k] = String(d[k]).trim();
    d.pan = d.pan.toUpperCase(); d.gstin = d.gstin.toUpperCase();
    if (d.phone && !PHONE.test(d.phone)) e.phone = 'Must be exactly 10 digits.';
    if (d.pan && !/^[A-Z]{5}\d{4}[A-Z]$/.test(d.pan)) e.pan = 'Format: ABCDE1234F';
    if (d.gstin && !/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(d.gstin)) e.gstin = 'Invalid 15-character GSTIN.';
    if (!showErrors(form, e)) return;
    S.owner = d; delete S.sampleOwner; save(); render(); toast('Owner details saved', 'ok');
  },
  rate(form) {
    const v = Number(form.rate.value);
    if (!showErrors(form, !(v > 0 && v <= 100) ? { rate: 'Enter a rate between ₹0.01 and ₹100.' } : {})) return;
    S.rate = Math.round(v * 100) / 100; save(); render(); toast(`Tariff set to ₹${S.rate}/unit`, 'ok');
  }
};

/* ---------- actions ---------- */
const ACT = {
  tab: id => go(id),
  mprev: () => { M = shiftM(M, -1); render(); },
  mnext: () => { M = shiftM(M, 1); render(); },
  mnow: () => { M = thisMonth(); render(); },
  closeModal: () => closeModal(),
  addRoom: () => openRoom(),
  editRoom: id => openRoom(id),
  goMeter: id => { go('meter'); setTimeout(() => { const i = $(`[data-meter="${id}"]`); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus(); } }, 50); },
  async pay(id) {
    const r = room(id), b = bill(r, M);
    if (!b.metered && S.rate > 0) {
      const c = await choose({ title: 'Meter reading missing', icon: 'fa-bolt', msg: `Room <b class="text-ink">${esc(r.no)}</b> has no sub-meter reading for ${esc(mLabel(M, true))}. If you continue, <b class="text-brand">electricity will not be billed</b> — only rent of ${inr(b.rent)} is recorded.`,
        buttons: [{ label: 'Log meter reading first', value: 'meter', cls: 'btn-brand', icon: 'fa-bolt' }, { label: `Mark paid · rent only ${inr(b.rent)}`, value: 'ok', cls: 'btn-ghost', icon: 'fa-check' }] });
      if (c === 'meter') return ACT.goMeter(id);
      if (c !== 'ok') return;
    }
    const m = M; recordPay(r, m); save(); render();
    toast(`RM ${r.no} marked paid · ${inr(b.total)}`, 'ok', { label: 'Undo', fn: () => { delete S.pay[m]?.[id]; save(); render(); toast('Payment undone'); } });
  },
  async undo(id) {
    const p = S.pay[M]?.[id]; if (!p) return;
    if (!await confirmBox('Undo payment?', `Move <b class="text-ink">RM ${esc(p.no)} · ${esc(p.tenant)}</b> (${inr(p.amt)}) back to pending for ${esc(mLabel(M, true))}?`, 'Undo payment', 'brand', 'fa-rotate-left')) return;
    delete S.pay[M][id]; if (!Object.keys(S.pay[M]).length) delete S.pay[M];
    save(); render(); toast('Payment moved back to pending');
  },
  async vacate(id) {
    const r = room(id), due = active(r, M) && !paidRec(r, M) ? bill(r, M).total : 0;
    if (!await confirmBox(`Vacate room ${r.no}?`, `${esc(r.tenant)} will be checked out. Payment history is kept for the ledger.${due ? `<br><b class="text-bad">Unpaid for ${esc(mLabel(M))}: ${inr(due)}</b>` : ''}`, 'Vacate room', 'bad', 'fa-door-open')) return;
    const name = r.tenant;
    Object.assign(r, { tenant: '', phone: '', guardian: '', gphone: '', moveIn: '' });
    save(); render(); toast(`${name} vacated room ${r.no}`, 'ok');
  },
  async delRoom(id) {
    const r = room(id);
    if (!await confirmBox(`Delete room ${r.no}?`, 'The room and its meter readings are removed. Recorded payments stay in the CA ledger. This cannot be undone.', 'Delete room')) return;
    S.rooms = S.rooms.filter(x => x.id !== id);
    for (const m in S.read) { delete S.read[m][id]; if (!Object.keys(S.read[m]).length) delete S.read[m]; }
    save(); render(); toast(`Room ${r.no} deleted`);
  },
  async clrMeter(id) {
    const r = room(id);
    if (!await confirmBox('Clear reading?', `Remove the ${esc(mLabel(M))} reading for room ${esc(r.no)}?`, 'Clear reading', 'bad', 'fa-eraser')) return;
    delete S.read[M]?.[id]; if (S.read[M] && !Object.keys(S.read[M]).length) delete S.read[M];
    save(); render(); toast('Reading cleared');
  },
  async delExp(id) {
    const e = S.exp.find(x => x.id === id); if (!e) return;
    S.exp = S.exp.filter(x => x.id !== id); save(); render();
    toast(`${(CAT[e.cat] || CAT.misc).name} ${inr(e.amt)} deleted`, 'info', { label: 'Undo', fn: () => { S.exp.push(e); save(); render(); } });
  },
  print: kind => printStatement(kind),
  export() {
    const blob = new Blob([JSON.stringify({ app: 'pg-ca-manager', version: VER, exported: new Date().toISOString(), data: S }, null, 2)], { type: 'application/json' });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `pg-ca-backup-${today()}.json` });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup exported', 'ok');
  },
  async clearSample() {
    if (!await confirmBox('Clear sample data?', 'Removes the demo rooms, readings, payments and expenses. Anything you added yourself is kept.', 'Clear sample data', 'brand', 'fa-broom')) return;
    const ids = new Set(S.rooms.filter(r => r.sample).map(r => r.id));
    S.rooms = S.rooms.filter(r => !r.sample); S.exp = S.exp.filter(e => !e.sample);
    for (const bag of [S.pay, S.read]) for (const m in bag) { for (const id of ids) delete bag[m][id]; if (!Object.keys(bag[m]).length) delete bag[m]; }
    if (S.sampleOwner) { S.owner = blank().owner; delete S.sampleOwner; }
    save(); render(); toast('Sample data cleared — add your first room', 'ok');
  },
  async reset() {
    if (!await confirmBox('Full reset?', 'This permanently erases <b class="text-bad">all rooms, payments, readings, expenses and settings</b> on this device. Export a backup first if you might need it.', 'Erase everything')) return;
    S = blank(); save(); M = thisMonth(); go('home'); toast('All data erased');
  },
  async install() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(() => {}); deferredPrompt = null;
    $('#installBtn').classList.add('hidden'); if (TAB === 'setup') render();
  }
};

async function importFile(input) {
  const f = input.files?.[0]; input.value = ''; if (!f) return;
  try {
    const d = normalize(JSON.parse(await f.text()));
    if (!await confirmBox('Replace data with backup?', `Backup contains <b class="text-ink">${d.rooms.length} rooms</b>, <b class="text-ink">${Object.keys(d.pay).length} months</b> of payments and <b class="text-ink">${d.exp.length} expenses</b>. Current data on this device will be replaced.`, 'Import backup', 'brand', 'fa-file-import')) return;
    S = d; save(); M = thisMonth(); go('home'); toast('Backup imported', 'ok');
  } catch (e) { toast(e.message.includes('backup') ? e.message : 'Could not read file — invalid JSON.', 'bad'); }
}

/* ---------- printable CA statement ---------- */
function printStatement(kind) {
  const fy = fyOf(M), months = kind === 'fy' ? fy.months : [M], set = new Set(months);
  const period = kind === 'fy' ? `${fy.label} (${mLabel(months[0], true)} – ${mLabel(months[11], true)})` : mLabel(M, true);
  const st = months.map(stats), o = S.owner;
  const rentC = sum(st.map(s => s.rentC)), elecC = sum(st.map(s => s.elecC)), income = rentC + elecC;
  const byCat = CATS.map(([k]) => ({ ...CAT[k], amt: sum(st.map(s => s.byCat.find(c => c.key === k).amt)) }));
  const expense = sum(byCat.map(c => c.amt)), net = income - expense;
  const pays = months.flatMap(m => Object.values(S.pay[m] || {}).map(p => ({ ...p, m }))).sort((a, b) => a.m.localeCompare(b.m) || String(a.no).localeCompare(String(b.no), undefined, { numeric: true }));
  const exps = S.exp.filter(e => set.has(e.date.slice(0, 7))).sort((a, b) => a.date.localeCompare(b.date));
  const pendNow = st.reduce((t, s) => t + s.pending, 0);
  const R = n => `<td class="r">${inr(n)}</td>`;
  $('#printDoc').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:20px">
      <div><div class="muted" style="font-size:9pt;letter-spacing:.12em;text-transform:uppercase">CA Auditor Tax Statement</div>
        <h1>${esc(o.pg || 'PG Accommodation')}</h1>
        <div class="muted">Statement of income &amp; expenditure — ${esc(period)}</div></div>
      <div style="text-align:right;font-size:9pt" class="muted">Generated ${esc(dLabel(today()))}<br>PG CA Manager v${VER}</div>
    </div>
    <table class="meta" style="margin-top:14px;width:auto"><tbody>
      <tr><td style="width:120px" class="muted">Proprietor</td><td><b>${esc(o.name || '—')}</b></td></tr>
      <tr><td class="muted">PAN</td><td>${esc(o.pan || '—')}</td></tr>
      ${o.gstin ? `<tr><td class="muted">GSTIN</td><td>${esc(o.gstin)}</td></tr>` : ''}
      <tr><td class="muted">Phone</td><td>${esc(o.phone || '—')}</td></tr>
      <tr><td class="muted">Address</td><td>${esc(o.address || '—')}</td></tr>
      <tr><td class="muted">Basis</td><td>Cash basis — receipts as recorded on date of collection</td></tr>
    </tbody></table>

    <h2>1. Profit &amp; Loss summary</h2>
    <table><thead><tr><th>Particulars</th><th class="r">Amount (₹)</th></tr></thead><tbody>
      <tr><td>Rental income (rent received)</td>${R(rentC)}</tr>
      <tr><td>Electricity charges recovered from tenants</td>${R(elecC)}</tr>
      <tr class="tot"><td>Gross receipts (A)</td>${R(income)}</tr>
      ${byCat.map(c => `<tr><td>Less: ${c.name} expenses</td>${R(c.amt)}</tr>`).join('')}
      <tr class="tot"><td>Total expenditure (B)</td>${R(expense)}</tr>
      <tr class="tot"><td>Net profit / (loss) (A − B)</td>${R(net)}</tr>
      <tr><td>Net margin</td><td class="r">${income ? pct(net / income * 100) : '—'}</td></tr>
      <tr><td>Outstanding rent receivable (not included above)</td>${R(pendNow)}</tr>
    </tbody></table>

    ${kind === 'fy' ? `<h2>2. Month-wise summary</h2>
    <table><thead><tr><th>Month</th><th class="r">Rent</th><th class="r">Electricity</th><th class="r">Expenses</th><th class="r">Net</th></tr></thead><tbody>
      ${months.map((m, i) => `<tr><td>${esc(mLabel(m))}</td>${R(st[i].rentC)}${R(st[i].elecC)}${R(st[i].expense)}${R(st[i].net)}</tr>`).join('')}
      <tr class="tot"><td>Total</td>${R(rentC)}${R(elecC)}${R(expense)}${R(net)}</tr></tbody></table>` : ''}

    <h2>${kind === 'fy' ? 3 : 2}. Rent collection register</h2>
    ${pays.length ? `<table><thead><tr><th>Month</th><th>Received on</th><th>Room</th><th>Tenant</th><th class="r">Rent</th><th class="r">Units</th><th class="r">Electricity</th><th class="r">Total</th></tr></thead><tbody>
      ${pays.map(p => `<tr><td>${esc(mLabel(p.m))}</td><td>${esc(p.on)}</td><td>${esc(p.no)}</td><td>${esc(p.tenant)}</td>${R(p.rent)}<td class="r">${p.units || '—'}</td>${R(p.elec)}${R(p.amt)}</tr>`).join('')}
      <tr class="tot"><td colspan="4">Total</td>${R(rentC)}<td class="r">${sum(pays.map(p => p.units))}</td>${R(elecC)}${R(income)}</tr></tbody></table>` : '<p class="muted">No receipts recorded for this period.</p>'}

    <h2>${kind === 'fy' ? 4 : 3}. Expense register</h2>
    ${exps.length ? `<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="r">Amount</th></tr></thead><tbody>
      ${exps.map(e => `<tr><td>${esc(e.date)}</td><td>${(CAT[e.cat] || CAT.misc).name}</td><td>${esc(e.note || '—')}</td>${R(e.amt)}</tr>`).join('')}
      <tr class="tot"><td colspan="3">Total</td>${R(expense)}</tr></tbody></table>` : '<p class="muted">No expenses recorded for this period.</p>'}

    <p class="muted" style="font-size:8.5pt;margin-top:16px">Declaration: The above figures are compiled from records maintained by the proprietor in PG CA Manager and are true to the best of their knowledge. Amounts are rounded to the nearest rupee. This statement is intended to assist the Chartered Accountant in preparing returns and does not by itself constitute an audited financial statement.</p>
    <div class="sign"><div>Proprietor signature<br>${esc(o.name || '')}</div><div>Chartered Accountant<br>(Name, M.No. &amp; UDIN)</div></div>`;
  setTimeout(() => window.print(), 50);
}

/* ---------- global event delegation ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el.dataset.id, el);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]'); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.submit]?.(f);
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change;
  if (k === 'month') { if (validMonth(e.target.value)) { M = e.target.value; render(); } }
  else if (k === 'import') importFile(e.target);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-digits]')) t.value = t.value.replace(/\D/g, '').slice(0, 10);
  if (t.classList.contains('invalid')) { t.classList.remove('invalid'); const p = t.form?.querySelector(`[data-err="${t.name}"]`); if (p) p.textContent = ''; }
  if (t.dataset.meter) {
    const out = $('#mp_' + t.dataset.meter), prev = Number(t.dataset.prev), raw = t.value.trim(), v = Number(raw);
    if (raw === '' || !isFinite(v)) out.innerHTML = '<span class="text-muted">Enter the reading shown on the sub-meter.</span>';
    else if (v < prev) out.innerHTML = `<span class="text-bad"><i class="fa-solid fa-ban mr-1"></i>Lower than previous reading (${prev}) — will be rejected</span>`;
    else { const u = Math.round((v - prev) * 10) / 10; out.innerHTML = `<span class="text-muted">${v} − ${prev} =</span> <b>${u} units</b> <span class="text-muted">× ₹${S.rate} =</span> <b class="text-ok">${inr(u * S.rate)}</b> <span class="text-muted text-xs">(preview)</span>`; }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- connectivity, install, service worker ---------- */
function netState() {
  const on = navigator.onLine, d = $('#netDot');
  d.className = 'badge ' + (on ? 'b-ok' : 'b-over'); d.lastElementChild.textContent = on ? 'Online' : 'Offline';
}
addEventListener('online', () => { netState(); requestSync(); });
addEventListener('offline', netState);
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').classList.remove('hidden'); if (TAB === 'setup') render(); });
addEventListener('appinstalled', () => { deferredPrompt = null; $('#installBtn').classList.add('hidden'); toast('PG CA Manager installed', 'ok'); });
addEventListener('storage', e => { if (e.key === KEY) { load(); render(); } });

async function requestSync() {
  try { const reg = await navigator.serviceWorker?.ready; if (reg && 'sync' in reg) await reg.sync.register('pgca-sync'); } catch (_) {}
}
if ('serviceWorker' in navigator) {
  addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w?.addEventListener('statechange', () => { if (w.state === 'activated' && navigator.serviceWorker.controller) toast('App updated', 'ok', { label: 'Reload', fn: () => location.reload() }); });
      });
      requestSync();
      if ('periodicSync' in reg) {
        const st = await navigator.permissions?.query({ name: 'periodic-background-sync' }).catch(() => null);
        if (st?.state === 'granted') reg.periodicSync.register('pgca-refresh', { minInterval: 24 * 60 * 60 * 1000 }).catch(() => {});
      }
      await navigator.serviceWorker.ready; const s = $('#swState'); if (s) s.innerHTML = '<span class="text-ok">Yes</span>';
    } catch (e) { console.warn('SW registration failed', e); }
  });
}
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

/* ---------- boot ---------- */
load();
(() => {
  const q = new URLSearchParams(location.search), map = { ca: 'ca', ledger: 'ca', meter: 'meter', rooms: 'rooms', setup: 'setup', home: 'home' };
  if (map[q.get('tab')]) TAB = map[q.get('tab')];
  const addRoom = q.get('action') === 'add_room' || /action=add_room/.test(location.pathname);
  if (addRoom) TAB = 'rooms';
  if (location.search || location.pathname !== '/') history.replaceState(null, '', '/');
  netState(); render();
  if (addRoom) openRoom();
})();
</script>
</body>
</html>
